<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2360 1000" font-family="'Noto Sans','DejaVu Sans',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdfbe7"/>
      <stop offset="1" stop-color="#e6f0fb"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="2360" height="1000" fill="url(#bg)"/>

  <text x="40" y="70" font-size="46" font-weight="700" fill="#16233f">Diferentes áreas que utilizam imagens</text>

  <!-- ── painel esquerdo: Visão Computacional ── -->
  <g>
    <rect x="20" y="130" width="520" height="820" rx="18" fill="#ffffff" stroke="#0d3b66" stroke-width="3"/>
    <path d="M 20 148 A 18 18 0 0 1 38 130 H 522 A 18 18 0 0 1 540 148 V 214 H 20 Z" fill="#0d3b66"/>
    <text x="46" y="184" font-size="32" font-weight="700" fill="#ffffff">👁️ Visão Computacional</text>

    <text x="46" y="256" font-size="25" fill="#111">
      <tspan font-weight="700">Imagem para Modelo</tspan>
      <tspan x="46" dy="34">(contrário da CG). Temos imagens e</tspan>
      <tspan x="46" dy="34">queremos extrair informação. Útil em:</tspan>
    </text>
    <text x="66" y="392" font-size="24" fill="#111">
      <tspan>– Robótica: detecção de obstáculos</tspan>
      <tspan x="66" dy="38">– Câmeras de vigilância e inspeção</tspan>
      <tspan x="66" dy="38">– Sensoriamento remoto</tspan>
      <tspan x="66" dy="38">– Imagens médicas</tspan>
      <tspan x="66" dy="38">– Reconhecimento de gestos e faces</tspan>
      <tspan x="66" dy="38">– Etc.</tspan>
    </text>
  </g>

  <!-- ── painel direito: Processamento de Imagens ── -->
  <g>
    <rect x="1820" y="130" width="520" height="820" rx="18" fill="#ffffff" stroke="#1b5e57" stroke-width="3"/>
    <path d="M 1820 148 A 18 18 0 0 1 1838 130 H 2322 A 18 18 0 0 1 2340 148 V 214 H 1820 Z" fill="#1b5e57"/>
    <text x="1846" y="184" font-size="32" font-weight="700" fill="#ffffff">🖼️ Processamento de Imagens</text>

    <text x="1846" y="256" font-size="25" fill="#111">
      <tspan font-weight="700">Imagem para Imagem</tspan>
      <tspan x="1846" dy="34">(geralmente)</tspan>
    </text>
    <text x="1866" y="330" font-size="24" fill="#111">
      <tspan>– Ferramenta básica para CG e VC</tspan>
      <tspan x="1866" dy="38">– Eliminar ruídos</tspan>
      <tspan x="1866" dy="38">– Melhorar contraste</tspan>
      <tspan x="1866" dy="38">– Identificar bordas</tspan>
      <tspan x="1866" dy="38">– Etc.</tspan>
    </text>
  </g>

  <!-- ── ovais cinzas ao redor ── -->
  <g fill="#e7e7e7" stroke="#9a9a9a" stroke-width="2">
    <ellipse cx="800" cy="420" rx="150" ry="72"/>
    <ellipse cx="1010" cy="230" rx="130" ry="70"/>
    <ellipse cx="1420" cy="230" rx="180" ry="70"/>
    <ellipse cx="1620" cy="460" rx="160" ry="72"/>
    <ellipse cx="1560" cy="740" rx="150" ry="72"/>
    <ellipse cx="880" cy="740" rx="180" ry="72"/>
  </g>
  <g font-size="27" fill="#16233f" text-anchor="middle">
    <text x="800" y="428">Robótica</text>
    <text x="1010" y="238">Outras</text>
    <text x="1420" y="238">Inteligência Artificial</text>
    <text x="1620" y="452">Aprendizado</text>
    <text x="1620" y="484">de Máquina</text>
    <text x="1560" y="748">Neurociência</text>
    <text x="880" y="732">Computação</text>
    <text x="880" y="764">Gráfica</text>
  </g>

  <!-- ── círculo central: Visão Computacional ── -->
  <circle cx="1190" cy="520" r="260" fill="#bfe0f7" stroke="#0d3b66" stroke-width="7"/>
  <text x="1190" y="450" font-size="34" font-weight="700" fill="#0d3b66" text-anchor="middle">Visão Computacional</text>
  <rect x="1030" y="530" width="320" height="130" rx="14" fill="#ffffff" fill-opacity="0.75"/>
  <text x="1190" y="570" font-size="25" font-weight="700" fill="#0d3b66" text-anchor="middle">Sinergia PDI + VC:</text>
  <text x="1190" y="602" font-size="22" fill="#0d3b66" text-anchor="middle">
    <tspan x="1190">PDI prepara a imagem,</tspan>
    <tspan x="1190" dy="28">VC interpreta.</tspan>
  </text>

  <!-- ── oval em destaque: Processamento de Imagens (sinergia) ── -->
  <ellipse cx="1190" cy="800" rx="240" ry="110" fill="#4f8a8b" stroke="#7ed957" stroke-width="6" filter="url(#glow)"/>
  <text x="1190" y="810" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">Processamento</text>
  <text x="1190" y="842" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">de Imagens</text>

  <!-- ── callouts (anotações) ── -->
  <g font-size="21" fill="#16233f">
    <rect x="560" y="160" width="330" height="120" rx="14" fill="#ffffff" fill-opacity="0.9" stroke="#16233f" stroke-width="2" stroke-dasharray="6,5"/>
    <text x="580" y="192"><tspan font-weight="700">Conexão:</tspan><tspan xml:space="preserve"> Sensores VC</tspan><tspan x="580" dy="30">guiam robôs.</tspan></text>

    <rect x="1470" y="60" width="340" height="130" rx="14" fill="#ffffff" fill-opacity="0.9" stroke="#16233f" stroke-width="2" stroke-dasharray="6,5"/>
    <text x="1490" y="92"><tspan font-weight="700">Aplicações:</tspan><tspan xml:space="preserve"> IA e AM treinam</tspan><tspan x="1490" dy="30">modelos de VC.</tspan></text>

    <rect x="620" y="850" width="330" height="120" rx="14" fill="#ffffff" fill-opacity="0.9" stroke="#16233f" stroke-width="2" stroke-dasharray="6,5"/>
    <text x="640" y="882"><tspan font-weight="700">Conexão:</tspan><tspan xml:space="preserve"> PDI melhora</tspan><tspan x="640" dy="30">renderizações.</tspan></text>

    <rect x="1500" y="850" width="420" height="120" rx="14" fill="#ffffff" fill-opacity="0.9" stroke="#16233f" stroke-width="2" stroke-dasharray="6,5"/>
    <text x="1520" y="882"><tspan font-weight="700">Paralelos:</tspan><tspan xml:space="preserve"> Como o cérebro</tspan><tspan x="1520" dy="30">processa vs. como a VC modela.</tspan></text>
  </g>
</svg>
